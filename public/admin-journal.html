<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bentoland Admin — Journal</title><style>:root{--paper:#f4f1ea;--ink:#151515;--muted:#74716a;--line:#d8d3ca;--red:#8d2c22}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1050px,calc(100% - 34px));margin:auto;padding:48px 0 90px}h1{font:400 clamp(44px,8vw,78px)/.95 Georgia,serif;margin:0 0 12px}h2{font:400 30px/1.1 Georgia,serif;margin:0 0 12px}h3{font:400 24px/1.1 Georgia,serif;margin:0}.muted,p{color:var(--muted);line-height:1.55}.nav{display:flex;gap:8px;margin:22px 0 30px;flex-wrap:wrap}.nav a{display:inline-block;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.nav a.active{background:var(--ink);color:#fff}.card{border-top:1px solid var(--line);padding-top:26px;margin-top:34px}label{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;margin:15px 0 7px}input,select,textarea,button{width:100%;font:inherit;padding:12px;border:1px solid var(--line);background:#fff}textarea{min-height:170px;resize:vertical}button{background:var(--ink);color:#fff;cursor:pointer}.secondary{background:#fff;color:var(--ink)}.danger{background:#fff;color:var(--red);border-color:#caa}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;gap:9px;align-items:center;margin-top:18px}.check input{width:auto}.check label{margin:0}.primary{margin-top:20px}.status{margin-top:12px;font-size:13px}.ok{color:#23662e}.bad{color:var(--red)}.entry{border-top:1px solid var(--line);padding:24px 0}.meta{font-size:11px;color:var(--muted);margin:7px 0 14px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.actions button{width:auto}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.thumb{position:relative}.thumb img{width:100%;aspect-ratio:4/3;object-fit:cover}.thumb button{position:absolute;right:5px;top:5px;width:auto;padding:5px 7px;background:#fff;color:var(--red);font-size:11px}.editor{margin-top:16px;padding:16px;border:1px solid var(--line);background:#f8f6f1}.hidden{display:none}.filter{max-width:220px}@media(max-width:700px){.row{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><h1>Bentoland</h1><p>Private publishing console.</p><nav class="nav"><a href="/admin">Photos</a><a class="active" href="/admin/journal">Journal</a><a href="/">View site</a><a href="/admin/logout">Lock</a></nav><section class="card"><h2>New journal entry</h2><form id="newForm"><div class="row"><div><label>Title</label><input name="title" required></div><div><label>Date</label><input name="entry_date" type="date"></div></div><label>Subtitle</label><input name="subtitle"><div class="row"><div><label>Location</label><input name="location"></div><div><label>Visibility</label><select name="visibility"><option value="draft">Draft</option><option value="private">Private</option><option value="public">Public</option></select></div></div><div class="row"><div><label>Camera</label><input name="camera"></div><div><label>Lens</label><input name="lens"></div></div><label>Journal text</label><textarea name="body" placeholder="What happened, what you photographed, what you want to remember…"></textarea><label>Photographs</label><input name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="row"><div class="check"><input id="newGallery" type="checkbox"><label for="newGallery">Also add uploaded photos to Gallery</label></div><div><label>Gallery category</label><select id="newGalleryCat"><option value="wildlife">Wildlife</option><option value="architecture">Architecture</option><option value="landscape">Landscape</option><option value="other" selected>Other</option><option value="archive">Archive</option></select></div></div><button class="primary" type="submit">Create entry</button><div id="newStatus" class="status"></div></form></section><section class="card"><div class="row"><div><h2>Entries</h2></div><div><label>Show</label><select id="filter" class="filter"><option value="all">All</option><option value="draft">Draft</option><option value="private">Private</option><option value="public">Public</option></select></div></div><div id="list"></div><div id="manageStatus" class="status"></div></section></main><script src="/admin-journal.js?v=1.1.0"></script></body></html>
