<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ea"><title>Journal — Ben Toland</title><meta name="description" content="Photographs, places, and field notes by Ben Toland."><style>
:root{--paper:#f4f1ea;--ink:#141414;--muted:#74716a;--line:#d8d3ca;--pad:clamp(18px,4vw,64px);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:auto}.masthead{height:96px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(244,241,234,.96);position:sticky;top:0;z-index:20}.brand{display:flex;flex-direction:column;gap:5px}.brand strong{font-family:var(--serif);font-size:clamp(23px,2.4vw,34px);font-weight:400;letter-spacing:.18em;text-transform:uppercase}.brand span,.eyebrow{font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted)}nav{display:flex;gap:26px}nav a{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.hero{padding:clamp(64px,9vw,130px) var(--pad) clamp(45px,6vw,80px);border-bottom:1px solid var(--line)}.hero h1{font:400 clamp(64px,12vw,160px)/.84 var(--serif);letter-spacing:-.05em;margin:10px 0 28px}.hero p{max-width:620px;font:400 clamp(18px,2vw,28px)/1.45 var(--serif);color:#3d3934;margin:0}.list{padding:0 var(--pad) 90px}.entry{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:clamp(28px,5vw,76px);padding:clamp(46px,7vw,90px) 0;border-bottom:1px solid var(--line)}.cover{aspect-ratio:16/10;background:#ddd;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.entry h2{font:400 clamp(36px,5vw,70px)/.96 var(--serif);letter-spacing:-.03em;margin:10px 0 18px}.entry .meta,.entry .count{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);line-height:1.7}.entry p{font:400 clamp(17px,1.8vw,24px)/1.5 var(--serif);color:#4d4942}.visibility{display:inline-block;border:1px solid var(--line);padding:5px 7px;margin-top:14px;font-size:8px;letter-spacing:.18em;text-transform:uppercase}.empty{padding:70px 0;font:400 clamp(28px,4vw,54px)/1 var(--serif);color:var(--muted)}.detail{padding:clamp(52px,7vw,96px) var(--pad) 110px}.detail-head{max-width:980px;margin:0 auto 48px}.back{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.detail h1{font:400 clamp(54px,9vw,118px)/.9 var(--serif);letter-spacing:-.045em;margin:24px 0 20px}.deck{font:400 clamp(20px,2.4vw,32px)/1.45 var(--serif);color:#4a4640;max-width:780px}.detail-meta{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);line-height:1.9;margin-top:20px}.story{max-width:760px;margin:0 auto}.story p{font:400 clamp(19px,2.1vw,27px)/1.65 var(--serif);margin:0 0 1.4em}.photos{margin-top:50px}.photo-block{margin:0 auto clamp(34px,6vw,84px);max-width:1400px}.photo-block figcaption{font-size:10px;color:var(--muted);margin-top:10px}.fieldnotes{max-width:760px;margin:70px auto 0;padding-top:25px;border-top:1px solid var(--line)}.fieldnotes h3{font:400 26px/1 var(--serif);margin:0 0 14px}.fieldnotes p{font-size:12px;line-height:1.8;color:var(--muted)}footer{padding:28px var(--pad) 38px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:.16em;text-transform:uppercase}@media(max-width:850px){.masthead{height:74px}.brand strong{font-size:18px}.entry{grid-template-columns:1fr}.entry-copy{order:-1}.hero h1{font-size:64px}nav a:first-child{display:none}}@media(max-width:560px){nav{gap:14px}.hero,.list,.detail{padding-left:18px;padding-right:18px}.entry h2{font-size:42px}footer{flex-direction:column;gap:10px}}
</style></head><body><header class="masthead"><a class="brand" href="/"><strong>Ben Toland</strong><span>Photographs</span></a><nav><a href="/">Home</a><a href="/journal">Journal</a><a href="/#about">About</a></nav></header><main id="app"><section class="hero"><span class="eyebrow">Field journal</span><h1>Journal</h1><p>Photographs, places, and notes from getting out there.</p></section><section class="list"><div class="empty">Loading journal…</div></section></main><footer><span>© <span id="year"></span> Ben Toland</span><span>Personal photography journal</span></footer><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>{if(!v)return'';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})};
const excerpt=v=>String(v||'').trim().split(/\n\s*\n/)[0].slice(0,280);
async function req(url){const r=await fetch(url,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Journal unavailable');return d}
function entryCard(e){return `<article class="entry"><a class="cover" href="/journal?entry=${encodeURIComponent(e.slug)}">${e.cover?`<img loading="lazy" src="${e.cover}" alt="${esc(e.title)}">`:''}</a><div class="entry-copy"><div class="meta">${[fmtDate(e.entry_date),e.location].filter(Boolean).map(esc).join(' · ')}</div><h2><a href="/journal?entry=${encodeURIComponent(e.slug)}">${esc(e.title)}</a></h2>${e.subtitle?`<p>${esc(e.subtitle)}</p>`:excerpt(e.body)?`<p>${esc(excerpt(e.body))}${String(e.body||'').length>280?'…':''}</p>`:''}<div class="count">${e.images?.length||0} photograph${e.images?.length===1?'':'s'}</div>${e.visibility!=='public'?`<span class="visibility">${esc(e.visibility)}</span>`:''}</div></article>`}
function paragraphs(text){return String(text||'').split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${esc(x).replace(/\n/g,'<br>')}</p>`).join('')}
async function list(){const d=await req('/journal-api/entries'),entries=d.entries||[];$('.list').innerHTML=entries.length?entries.map(entryCard).join(''):'<div class="empty">No public journal entries yet.</div>'}
async function detail(slug){const d=await req('/journal-api/entries/'+encodeURIComponent(slug)),e=d.entry;document.title=`${e.title} — Ben Toland`;$('#app').innerHTML=`<article class="detail"><div class="detail-head"><a class="back" href="/journal">← Journal</a><h1>${esc(e.title)}</h1>${e.subtitle?`<div class="deck">${esc(e.subtitle)}</div>`:''}<div class="detail-meta">${[fmtDate(e.entry_date),e.location,e.visibility!=='public'?e.visibility:null].filter(Boolean).map(esc).join(' · ')}</div></div>${e.body?`<div class="story">${paragraphs(e.body)}</div>`:''}${e.images?.length?`<div class="photos">${e.images.map((im,i)=>`<figure class="photo-block"><img loading="${i?'lazy':'eager'}" src="${im.url}" alt="${esc(im.caption||e.title)}">${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:''}</figure>`).join('')}</div>`:''}${(e.camera||e.lens)?`<section class="fieldnotes"><h3>Field notes</h3><p>${[e.camera,e.lens].filter(Boolean).map(esc).join(' · ')}</p></section>`:''}</article>`}
(async()=>{document.getElementById('year').textContent=new Date().getFullYear();const slug=new URLSearchParams(location.search).get('entry');try{slug?await detail(slug):await list()}catch(err){$('#app').innerHTML=`<section class="hero"><span class="eyebrow">Journal</span><h1>Not found</h1><p>${esc(err.message)}</p></section>`}})();
</script></body></html>
