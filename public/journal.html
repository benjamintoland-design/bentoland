<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f1ea">
<title>Journal — Ben Toland</title>
<style>
:root{--paper:#f4f1ea;--ink:#141414;--muted:#74716a;--line:#d8d3ca;--pad:clamp(18px,4vw,64px);--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:auto}.masthead{min-height:86px;padding:18px var(--pad);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(244,241,234,.96);z-index:10}.brand strong{display:block;font:400 clamp(20px,2.4vw,32px)/1 var(--serif);letter-spacing:.16em;text-transform:uppercase}.brand span,.eyebrow{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}nav{display:flex;gap:20px;align-items:center}nav a,nav button{font:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:0;background:none;padding:0;cursor:pointer}.hero{padding:clamp(62px,9vw,120px) var(--pad) clamp(42px,6vw,75px);border-bottom:1px solid var(--line)}.hero h1{font:400 clamp(62px,12vw,150px)/.85 var(--serif);letter-spacing:-.05em;margin:10px 0 25px}.hero p{font:400 clamp(18px,2vw,28px)/1.45 var(--serif);max-width:650px;color:#403c36}.access{margin-top:22px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.list{padding:0 var(--pad) 90px}.entry{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr);gap:clamp(28px,5vw,70px);padding:clamp(44px,7vw,85px) 0;border-bottom:1px solid var(--line)}.cover{aspect-ratio:16/10;background:#ddd;overflow:hidden}.cover img{height:100%;object-fit:cover}.entry h2{font:400 clamp(36px,5vw,68px)/.96 var(--serif);letter-spacing:-.03em;margin:10px 0 18px}.meta,.count{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);line-height:1.7}.entry p{font:400 clamp(17px,1.8vw,23px)/1.5 var(--serif);color:#4d4942}.visibility{display:inline-block;border:1px solid var(--line);padding:5px 8px;margin-top:14px;font-size:8px;letter-spacing:.17em;text-transform:uppercase}.empty{padding:70px 0;font:400 clamp(28px,4vw,52px)/1 var(--serif);color:var(--muted)}.detail{padding:clamp(50px,7vw,90px) var(--pad) 100px}.detail-head{max-width:980px;margin:0 auto 48px}.back{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.detail h1{font:400 clamp(52px,9vw,112px)/.9 var(--serif);letter-spacing:-.045em;margin:24px 0 20px}.deck{font:400 clamp(20px,2.4vw,31px)/1.45 var(--serif);color:#4a4640;max-width:780px}.detail-meta{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);line-height:1.9}.story{max-width:760px;margin:0 auto}.story p{font:400 clamp(19px,2.1vw,27px)/1.65 var(--serif);margin:0 0 1.4em}.photos{margin-top:50px}.photo-block{margin:0 auto clamp(34px,6vw,80px);max-width:1400px}.fieldnotes{max-width:760px;margin:70px auto 0;padding-top:25px;border-top:1px solid var(--line)}.fieldnotes h3{font:400 26px/1 var(--serif)}.fieldnotes p{font-size:12px;color:var(--muted);line-height:1.7}.fieldnotes .exif-status{opacity:.7}footer{padding:28px var(--pad);border-top:1px solid var(--line);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
@media(max-width:800px){.entry{grid-template-columns:1fr}.entry-copy{order:-1}.masthead{min-height:72px}nav{gap:12px}nav a:first-child{display:none}}
@media(max-width:520px){.hero,.list,.detail{padding-left:18px;padding-right:18px}.entry h2{font-size:42px}}
</style>
</head>
<body>
<header class="masthead"><a class="brand" href="/"><strong>Ben Toland</strong><span>Photographs</span></a><nav><a href="/">Home</a><a href="/journal">Journal</a><a id="familyLink" href="/family">Family</a><button id="logout" hidden>Sign out</button></nav></header>
<main id="app"><section class="hero"><span class="eyebrow">Field journal</span><h1>Journal</h1><p>Photographs, places, and notes from getting out there.</p><div id="access" class="access"></div></section><section class="list"><div class="empty">Loading journal…</div></section></main>
<footer>© <span id="year"></span> Ben Toland · Personal photography journal</footer>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>{if(!v)return'';const d=new Date(v+'T12:00:00');return d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})};
async function req(url){const r=await fetch(url,{cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Journal unavailable');return d}
function card(e){return `<article class="entry"><a class="cover" href="/journal?entry=${encodeURIComponent(e.slug)}">${e.cover?`<img loading="lazy" src="${e.cover}" alt="${esc(e.title)}">`:''}</a><div class="entry-copy"><div class="meta">${[fmt(e.entry_date),e.location].filter(Boolean).map(esc).join(' · ')}</div><h2><a href="/journal?entry=${encodeURIComponent(e.slug)}">${esc(e.title)}</a></h2>${e.subtitle?`<p>${esc(e.subtitle)}</p>`:''}<div class="count">${e.images?.length||0} photographs</div>${e.visibility!=='public'?`<span class="visibility">${e.visibility==='private'?'Family private':'Draft'}</span>`:''}</div></article>`}
function paras(t){return String(t||'').split(/\n\s*\n/).filter(Boolean).map(x=>`<p>${esc(x.trim()).replace(/\n/g,'<br>')}</p>`).join('')}
function access(d){if(d.family){$('#access').textContent='Family access · Private entries unlocked';$('#familyLink').hidden=true;$('#logout').hidden=false}else if(d.admin){$('#access').textContent='Admin preview · Private entries unlocked';$('#familyLink').hidden=true}else{$('#access').innerHTML='<a href="/family">Family member? Unlock private journal →</a>'}}

function readExifBuffer(buffer){
 try{
  const v=new DataView(buffer);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return{};let o=2;
  while(o+4<v.byteLength){
   if(v.getUint16(o)===0xFFE1){
    const start=o+4;if(start+10>v.byteLength)break;
    if(String.fromCharCode(v.getUint8(start),v.getUint8(start+1),v.getUint8(start+2),v.getUint8(start+3))!=='Exif')break;
    const t=start+6,le=v.getUint16(t)===0x4949,u16=x=>v.getUint16(x,le),u32=x=>v.getUint32(x,le),rat=x=>{const d=u32(x+4);return d?u32(x)/d:0};
    const read=(base,off)=>{const n=u16(off),out={};for(let i=0;i<n;i++){const e=off+2+i*12;if(e+12>v.byteLength)break;const tag=u16(e),type=u16(e+2),count=u32(e+4),bytes=count*(type===2?1:type===3?2:4),ptr=bytes<=4?e+8:base+u32(e+8);if(ptr>=v.byteLength)continue;if(type===2){let s='';for(let j=0;j<count-1&&ptr+j<v.byteLength;j++)s+=String.fromCharCode(v.getUint8(ptr+j));out[tag]=s}else if(type===3)out[tag]=u16(ptr);else if(type===4)out[tag]=u32(ptr);else if(type===5&&ptr+7<v.byteLength)out[tag]=rat(ptr)}return out};
    const ifd=read(t,t+u32(t+4)),ex=ifd[0x8769]?read(t,t+ifd[0x8769]):{};
    return {camera:[ifd[0x010F],ifd[0x0110]].filter(Boolean).join(' ').trim(),lens:String(ex[0xA434]||'').trim(),focal_length:ex[0x920A]?`${Math.round(ex[0x920A]*10)/10} mm`:'',aperture:ex[0x829D]?`f/${Math.round(ex[0x829D]*10)/10}`:'',shutter_speed:ex[0x829A]?(ex[0x829A]<1?`1/${Math.round(1/ex[0x829A])}s`:`${Math.round(ex[0x829A]*100)/100}s`):'',iso:ex[0x8827]?`ISO ${ex[0x8827]}`:''};
   }
   const len=v.getUint16(o+2);if(!len)break;o+=2+len;
  }
 }catch{}
 return{};
}
async function exifFromUrl(url){
 try{
  const r=await fetch(url,{cache:'no-store'});if(!r.ok)return{};const b=await r.arrayBuffer();return readExifBuffer(b.slice(0,Math.min(b.byteLength,1024*1024)));
 }catch{return{}}
}
function cleanCamera(v){return String(v||'').replace(/^SONY\s+/i,'Sony ').replace(/\s+/g,' ').trim()}
async function populateFieldNotes(e){
 const out=$('#fieldnotes-data');if(!out)return;
 let x={};if(e.images?.[0]?.url)x=await exifFromUrl(e.images[0].url);
 const parts=[cleanCamera(x.camera)||e.camera,x.lens||e.lens,x.focal_length,x.aperture,x.shutter_speed,x.iso].filter(Boolean);
 if(parts.length){out.textContent=parts.join(' · ');out.classList.remove('exif-status')}else{const section=out.closest('.fieldnotes');if(section)section.hidden=true}
}

async function list(){const d=await req('/journal-api/entries');access(d);$('.list').innerHTML=d.entries?.length?d.entries.map(card).join(''):'<div class="empty">No journal entries yet.</div>'}
async function detail(slug){
 const d=await req('/journal-api/entries/'+encodeURIComponent(slug)),e=d.entry;access(d);document.title=e.title+' — Ben Toland';
 $('#app').innerHTML=`<article class="detail"><div class="detail-head"><a class="back" href="/journal">← Journal</a><h1>${esc(e.title)}</h1>${e.subtitle?`<div class="deck">${esc(e.subtitle)}</div>`:''}<div class="detail-meta">${[fmt(e.entry_date),e.location,e.visibility==='private'?'Family private':e.visibility==='draft'?'Draft':null].filter(Boolean).map(esc).join(' · ')}</div></div>${e.body?`<div class="story">${paras(e.body)}</div>`:''}${e.images?.length?`<div class="photos">${e.images.map((im,i)=>`<figure class="photo-block"><img loading="${i?'lazy':'eager'}" src="${im.url}" alt="${esc(e.title)}"></figure>`).join('')}</div>`:''}${e.images?.length||e.camera||e.lens?`<section class="fieldnotes"><h3>Field notes</h3><p id="fieldnotes-data" class="exif-status">Reading photo metadata…</p></section>`:''}</article>`;
 await populateFieldNotes(e);
}
$('#logout').onclick=async()=>{await fetch('/journal-api/family/logout',{method:'POST'});location.href='/journal'};
document.getElementById('year').textContent=new Date().getFullYear();
const slug=new URLSearchParams(location.search).get('entry');(slug?detail(slug):list()).catch(err=>{$('#app').innerHTML=`<section class="hero"><h1>Not found</h1><p>${esc(err.message)}</p></section>`});
</script>
</body>
</html>
