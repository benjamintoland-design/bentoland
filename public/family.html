<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f1ea"><title>Family Journal — Ben Toland</title><style>:root{--paper:#f4f1ea;--ink:#141414;--muted:#74716a;--line:#d8d3ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(520px,100%);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:48px 0}a{color:inherit}small,label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}h1{font:400 clamp(52px,11vw,88px)/.9 Georgia,"Times New Roman",serif;letter-spacing:-.04em;margin:15px 0 24px}p{font:400 20px/1.5 Georgia,"Times New Roman",serif;color:#4b4740}input,button{width:100%;font:inherit;font-size:18px;padding:17px;border:1px solid var(--line);border-radius:0}input{background:#fff;margin:8px 0 12px}button{background:var(--ink);color:white;cursor:pointer}.status{min-height:24px;margin-top:14px;font-size:13px;color:#8d3325}.back{display:inline-block;margin-top:28px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none}</style></head><body><main class="box"><small>Ben Toland · Family</small><h1>Family Journal</h1><p>Private photographs and notes for family. Public journal entries are still available to everyone.</p><form id="login"><label for="pw">Family password</label><input id="pw" type="password" autocomplete="current-password" required><button>Enter journal</button><div id="status" class="status"></div></form><a class="back" href="/journal">← Public journal</a></main><script>const status=document.getElementById('status');fetch('/journal-api/family/status',{cache:'no-store'}).then(r=>r.json()).then(x=>{if(x.family||x.admin)location.replace('/journal')});document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();status.textContent='';const r=await fetch('/journal-api/family/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})}),d=await r.json().catch(()=>({}));if(r.ok)location.replace('/journal');else status.textContent=d.error||'Could not sign in.'});</script></body></html>
