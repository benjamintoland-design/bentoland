<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ben Toland</title>
  <meta name="description" content="Photography by Ben Toland">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    p {
      margin-top: 18px;
      color: #999;
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Ben Toland</h1>
      <p>Photography</p>
    </div>
  </header>
</body>
</html>
